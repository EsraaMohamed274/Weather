<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live weather forecast app with real-time updates."
    />
    <title>Weather App</title>
    <link rel="stylesheet" href="./CSS/all.min.css" />
    <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <header class="mainColor w-100 p-5">
      <nav class="navbar navbar-expand-lg navbar-dark mainColor">
        <div class="container">
          <div class="d-flex align-items-center logo">
            <a class="navbar-brand" href="#">
              <img
                class="w-100"
                src="./Images/imgi_1_logo.png"
                alt="Weather Logo"
              />
            </a>
            <a class="ms-2 text-white text-decoration-none" href="#">
              <h1 class="m-0">Weather</h1>
              <small>tagline goes here</small>
            </a>
          </div>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="#">Home</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">News</a></li>
              <li class="nav-item">
                <a class="nav-link" href="#">Live Cameras</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">Photos</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container p-5">
        <div class="input-group mb-3 w-100 position-relative">
          <input
            type="text"
            id="cityInput"
            class="form-control rounded-5 py-2 px-5 mainColor"
            placeholder="Find your location"
            aria-label="City name"
          />
          <button
            class="btn btn-primary rounded-5 position-absolute"
            id="getWeatherBtn"
            type="button"
          >
            Find
          </button>
        </div>
        <div id="errorMsg" class="text-danger mb-3 d-none"></div>

        <div class="row" id="weatherCards">
          <div class="col-md-4 mb-3">
            <div
              class="card mainColor weather-card h-100 p-3 text-center rounded-4 shadow-sm"
              id="day1"
            ></div>
          </div>
          <div class="col-md-4 mb-3">
            <div
              class="card mainColor weather-card h-100 p-3 text-center rounded-4 shadow-sm"
              id="day2"
            ></div>
          </div>
          <div class="col-md-4 mb-3">
            <div
              class="card mainColor weather-card h-100 p-3 text-center rounded-4 shadow-sm"
              id="day3"
            ></div>
          </div>
        </div>

        <div id="weatherResult" class="mt-4"></div>
      </section>
    </main>
    <footer class="secondaryColor py-5">
      <section class="container d-flex justify-content-around p-5">
        <div class="input-group mb-3 w-75 position-relative">
          <input
            type="email"
            id="cityInput"
            class="form-control rounded-5 py-2 px-5 mainColor"
            placeholder="Enter your email to subscribe"
            aria-label="City name"
          />
          <button
            class="btn btn-primary rounded-5 position-absolute"
            id="getWeatherBtn"
            type="button"
          >
            Subscribe
          </button>
        </div>
        <div class="socialMedia">
          <a
            href="https://www.facebook.com "
            class="p-2 mainColor rounded-circle"
            ><i class="fa-brands fa-facebook-f"></i
          ></a>
          <a href="https://www.twitter.com" class="p-2 mainColor rounded-circle"
            ><i class="fa-brands fa-twitter"></i
          ></a>
          <a
            href="https://www.instagram.com"
            class="p-2 mainColor rounded-circle"
            ><i class="fa-brands fa-instagram"></i
          ></a>
          <a href="https://www.youtube.com" class="p-2 mainColor rounded-circle"
            ><i class="fa-brands fa-youtube"></i
          ></a>
        </div>
      </section>
      <div class="text-center p-1">
        <p class="m-0 text-white">
          Copyright 2014 Company name. Designed by Themezy. All rights reserved
        </p>
      </div>
    </footer>

    <script src="./JS/all.min.js"></script>
    <script src="./JS/bootstrap.bundle.min.js"></script>
    <script src="./JS/index.js"></script>
  </body>
</html>
